name: Release

# Builds release binaries for Linux x86_64 and aarch64 (native runners, so no
# cross-compilation of OpenSSL is needed), packages them, computes checksums,
# and attaches everything to a GitHub release.
#
# Trigger: push a tag matching `v*` (e.g. `git tag v0.1.2 && git push --tags`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config cmake

      - name: Build release
        run: cargo build --release

      - name: Package tarball
        run: |
          mkdir -p dist
          # The tarball contains the binary named `raddex` (install.sh extracts
          # and installs exactly that); the tarball name carries the target.
          cp target/release/raddex dist/raddex
          cp LICENSE README.md dist/
          tar -czf "raddex-${{ matrix.target }}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: raddex-${{ matrix.target }}
          path: raddex-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          for f in $(find . -name "*.tar.gz"); do
            bn=$(basename "$f")
            sha256sum "$f" | sed "s|$f|$bn|" >> SHA256SUMS
          done
          # install.sh lives at the repo root (outside artifacts/); record its
          # checksum under the bare filename so `shasum -c SHA256SUMS` works
          # from a directory holding install.sh + the tarballs.
          sha256sum ../install.sh | sed 's|\.\./install.sh|install.sh|' >> SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/raddex-*/raddex-*.tar.gz
            artifacts/SHA256SUMS
            install.sh
