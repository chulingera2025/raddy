name: Pages

# Builds the Astro (Starlight) documentation site in `page/` — English at the
# site root, Chinese under /zh-cn/ — and deploys it to GitHub Pages on every
# `main` push. Pull requests run the same build plus the internal link check as
# a validation gate; nothing is uploaded or deployed for PRs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Key on the ref so different PRs never cancel each other, while new runs for
  # the same PR branch or a `main` push still cancel the old run. `main` deploys
  # (`refs/heads/main`) and PR builds (`refs/pull/<n>/merge`) stay separate.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: page
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: page/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check internal links
        run: pnpm check:links

      - name: Build site
        run: pnpm build

      - name: Upload pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: page/dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
