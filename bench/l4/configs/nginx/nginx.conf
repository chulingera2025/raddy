worker_processes 2;
worker_rlimit_nofile 300000;

events {
    worker_connections 200000;
    multi_accept on;
}

stream {
    upstream tcp_origin {
        server origin:19000;
    }

    server {
        listen 18000;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass tcp_origin;
    }

    upstream udp_origin {
        server origin:19001;
    }

    server {
        listen 18001 udp reuseport;
        proxy_timeout 1h;
        proxy_pass udp_origin;
    }
}
