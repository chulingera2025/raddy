name: raddex-l4-bench

x-raddex-common: &raddex-common
  build:
    context: ../..
    dockerfile: bench/l4/raddex/Dockerfile
    args:
      RUST_IMAGE: ${RUST_IMAGE}
      RUNTIME_IMAGE: ${RUNTIME_IMAGE}
  cpus: ${L4_BENCH_CPUS:-2.0}
  mem_limit: ${L4_BENCH_MEMORY_LIMIT:-1g}
  ulimits:
    nofile:
      soft: 300000
      hard: 300000
  depends_on:
    origin:
      condition: service_healthy
  volumes:
    - ./configs/raddex/Raddexfile:/etc/raddex/Raddexfile:ro

services:
  origin:
    build:
      context: ./origin
      args:
        RUST_IMAGE: ${RUST_IMAGE}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE}
    expose:
      - "19000"
      - "19001/udp"
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
    healthcheck:
      test: ["CMD", "/usr/local/bin/l4-bench-origin", "--healthcheck"]
      interval: 1s
      timeout: 2s
      retries: 60
    networks:
      - origin_net

  nginx:
    image: ${NGINX_IMAGE}
    cpus: ${L4_BENCH_CPUS:-2.0}
    mem_limit: ${L4_BENCH_MEMORY_LIMIT:-1g}
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
    depends_on:
      origin:
        condition: service_healthy
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - client_net
      - origin_net

  caddy:
    build:
      context: ./caddy
      args:
        CADDY_BUILDER_IMAGE: ${CADDY_BUILDER_IMAGE}
        CADDY_RUNTIME_IMAGE: ${CADDY_RUNTIME_IMAGE}
        CADDY_VERSION: ${CADDY_VERSION}
        CADDY_L4_VERSION: ${CADDY_L4_VERSION}
    cpus: ${L4_BENCH_CPUS:-2.0}
    mem_limit: ${L4_BENCH_MEMORY_LIMIT:-1g}
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
    depends_on:
      origin:
        condition: service_healthy
    volumes:
      - ./configs/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    networks:
      - client_net
      - origin_net

  raddex:
    <<: *raddex-common
    command: ["run", "-c", "/etc/raddex/Raddexfile", "--threads", "${RADDEX_THREADS:-2}"]
    networks:
      - client_net
      - origin_net

  router:
    build:
      context: ./router
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE}
    cpus: ${L4_BENCH_CPUS:-2.0}
    mem_limit: ${L4_BENCH_MEMORY_LIMIT:-1g}
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nft list ruleset >/dev/null 2>&1"]
      interval: 1s
      timeout: 2s
      retries: 30
    networks:
      - client_net
      - origin_net

  loadgen:
    build:
      context: ./loadgen
      args:
        RUST_IMAGE: ${RUST_IMAGE}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE}
    ulimits:
      nofile:
        soft: 300000
        hard: 300000
    networks:
      - client_net

  reporter:
    build:
      context: ./reporter
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
        MATPLOTLIB_VERSION: ${MATPLOTLIB_VERSION}
    working_dir: /bench-l4
    entrypoint: ["python"]
    network_mode: none
    environment:
      MPLBACKEND: Agg
    volumes:
      - .:/bench-l4
      - ../../page/public/benchmarks:/public/benchmarks

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  origin_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
