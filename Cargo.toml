[package]
name = "raddex"
version = "0.3.5"
edition = "2021"
authors = ["chulingera2025"]
description = "A minimal high-performance reverse proxy gateway built on Cloudflare Pingora"
license = "Apache-2.0"
readme = "README.md"
keywords = ["reverse-proxy", "gateway", "pingora", "http", "tls"]
categories = ["network-programming", "web-programming"]

[dependencies]
arc-swap = "1"
async-trait = "0.1"
base64 = "0.23"
# bcrypt password verification for the `basic_auth` guard (spec §5.10).
bcrypt = "0.19"
# Brotli compression for the `encode` directive (spec §5.11).
brotli = "8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
http = "1"
instant-acme = { version = "0.8.5", features = ["rcgen"] }
libc = "0.2"
mime_guess = "2"
# openssl is linked through pingora's `openssl` feature; declared directly to
# read certificate expiry (`X509::not_after`) for the M8 renewal scheduler.
openssl = "0.10"
# Note: pingora has NO default features (`default = []`); `proxy`, `lb`, and a
# TLS backend must be enabled explicitly. M4 adds the `openssl` backend for the
# SNI dynamic-cert listeners and ACME.
pingora = { version = "0.8", features = ["proxy", "lb", "openssl"] }
prometheus = "0.13"
# Self-signed certificate generation for the `tls internal` directive (spec §5.7).
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
# Socket options (receive/send buffer sizes) for the layer-4 UDP listeners;
# std::net::UdpSocket no longer exposes the buffer setters directly.
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
time = "0.3"
# Async OpenSSL handshake for the layer-4 `tcp { tls ... }` listeners, whose
# data path is native Tokio and therefore cannot use pingora's TLS listener.
tokio-openssl = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Blocking HTTP client for the DNS-01 Cloudflare API calls (spec §5.3). The ACME
# issuance worker runs on its own single-threaded runtime and serializes orders,
# so blocking a call there is acceptable. `json` enables send_json/into_json.
ureq = { version = "2", features = ["json"] }
# rustls is pulled transitively by the ACME client (instant-acme -> hyper-rustls)
# and the DNS-01 client (ureq); feature unification enables BOTH crypto backends
# (aws-lc-rs via instant-acme, ring via rustls-platform-verifier), which makes
# rustls 0.23 refuse to auto-select a provider and panic on first TLS use.
# Declared directly so startup installs the aws-lc-rs provider explicitly.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
zstd = "0.13"

[dev-dependencies]
h2 = "0.4"
rcgen = "0.14"
tokio-openssl = "0.6"
